

name: Deploy Website to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Check EC2 Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${EC2_USERNAME}@${EC2_HOST} \
            "whoami && hostname"

      - name: Deploy Website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -i ~/.ssh/ec2_key" \
            ./ ${EC2_USERNAME}@${EC2_HOST}:/var/www/cloudtech/

      - name: Debug Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${EC2_USERNAME}@${EC2_HOST} \
            'echo "===== REMOTE SERVER =====";
             hostname;
             echo "===== DIRECTORY =====";
             ls -lah /var/www/cloudtech/;
             echo "===== INDEX FILE =====";
             if [ -f /var/www/cloudtech/index.html ]; then
               echo "File exists"
               wc -c /var/www/cloudtech/index.html
             else
               echo "File does not exist"
               exit 1
             fi'

      - name: Verify Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${EC2_USERNAME}@${EC2_HOST} \
            "if [ -s /var/www/cloudtech/index.html ]; then
               echo 'Deployment successful!'
             else
               echo 'ERROR: index.html missing or empty!'
               exit 1
             fi"